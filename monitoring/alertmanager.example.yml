# Integration example, not a working notification destination.
# Replace the reserved .invalid URL and supply authentication outside this tree.
# Every alert, including backup alerts, follows this route. No discard receiver.
global:
  resolve_timeout: 5m
route:
  receiver: webhook
  group_by: [alertname, job, instance, backup_job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
- name: webhook
  webhook_configs:
  - url: https://alerts.example.invalid/alertmanager
    send_resolved: true
