groups:
- name: infrastructure
  rules:
  - alert: EndpointDown
    expr: probe_success{job=~"blackbox-http|blackbox-tcp|blackbox-dns"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Endpoint probe failed
  - alert: ExporterDown
    expr: up == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Prometheus scrape failed
  - alert: EndpointInventoryEmpty
    expr: absent(up{job=~"blackbox-http|blackbox-tcp|blackbox-dns"})
    for: 15m
    labels:
      severity: info
    annotations:
      summary: No endpoint probes configured
  - alert: HostHighCPU
    expr: 100 * (1 - avg by (instance, job) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host CPU usage above 90 percent
  - alert: HostHighMemory
    expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host memory usage above 90 percent
  - alert: HostFilesystemLowSpace
    expr: |
      (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}
        / node_filesystem_size_bytes < 0.15)
      and on(instance, job, device, mountpoint) (node_filesystem_readonly == 0)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host filesystem has less than 15 percent available
  - alert: HostFilesystemLowInodes
    expr: |
      (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}
        / node_filesystem_files < 0.10)
      and on(instance, job, device, mountpoint) (node_filesystem_readonly == 0)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host filesystem has less than 10 percent free inodes
- name: backup-telemetry
  rules:
  - alert: BackupTooOld
    expr: time() - homelab_backup_last_success_timestamp_seconds > 36 * 3600
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: Reported successful backup is older than 36 hours
  - alert: BackupTelemetryMissing
    expr: absent_over_time(homelab_backup_last_success_timestamp_seconds[1h])
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: No successful backup timestamp has been observed in one hour
  - alert: ExpectedBackupMissing
    expr: (homelab_backup_expected == 1) unless on(backup_job) homelab_backup_last_success_timestamp_seconds
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: An expected backup has no success timestamp
  - alert: BackupInventoryMissing
    expr: absent(homelab_backup_expected)
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Expected backup inventory metric is missing
  - alert: BackupTimestampInFuture
    expr: homelab_backup_last_success_timestamp_seconds > time() + 300
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Backup timestamp is more than five minutes in the future
- name: monitoring-health
  rules:
  - alert: TextfileCollectorError
    expr: node_textfile_scrape_error != 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node exporter could not read textfile metrics
  - alert: PrometheusRuleEvaluationFailures
    expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Prometheus rule evaluations are failing
  - alert: AlertDeliveryFailures
    expr: increase(alertmanager_notifications_failed_total[5m]) > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Alertmanager notification delivery is failing
