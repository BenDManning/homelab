<text x="36" y="546" class="heading">Three hosts carry both DNS and PostgreSQL</text>
<text x="36" y="579" class="note">dns1/pg1 → pve02 · dns2/pg2 → pve04 · dns3/pg3 → pve05</text>
<text x="36" y="614" class="note">Guest distribution is not proof of replication, failover or independent site-level recovery.</text>
