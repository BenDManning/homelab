<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Five-node homelab placement, 12 November 2026</title>
<desc id="desc">Five online Proxmox nodes. The diagram lists 17 running guests. Management and core-services remain running but are due for retirement. DNS and PostgreSQL guests occupy pve02, pve04 and pve05. Four stopped guests are listed in the inventory, not shown here. Placement does not prove service health or failover.</desc>
<style>text{font-family:ui-monospace,Consolas,monospace;fill:#e2e8f0}.heading{font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700;fill:#67e8f9}.label{font-size:14px}.note{font-size:14px;fill:#cbd5e1}</style>
<rect width="1200" height="760" rx="16" fill="#0f172a"/>
