services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
    - ${BIND_IP:-127.0.0.1}:${HOMEPAGE_PORT:-3002}:3000
    volumes:
    - ./config:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3002,127.0.0.1:3002}
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      LOG_TARGETS: stdout
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - -Y
      - 'off'
      - http://127.0.0.1:3000/api/healthcheck
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
